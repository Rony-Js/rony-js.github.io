# ============================================================
# ABOUT
# ============================================================
about: |
  Hi, I'm Ronelvys. I am currently a student at the Carlos Marx Pre-University
  Institute of Exact Sciences. I am passionate about science, especially
  computer science. I am always creating and learning because it is my passion,
  and I like to make the most of my time and not feel like I am wasting it.
  I can adapt to any environment, from working individually to working in a
  team, even as the leader, as long as it is to achieve success. I have
  participated in projects in my community and I was also the creator of the
  first private competitive programming project there.

